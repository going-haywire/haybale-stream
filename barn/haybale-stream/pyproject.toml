[project]
name = "haybale-stream"
version = "0.0.3"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "haybale-image>=0.3.4",
    "haywire-core>=0.3.0",
    "numpy",
    # NDI and OMT wheels bundle their native libraries on Linux, macOS and Windows.
    "cyndilib>=0.1.3",
    "cyomtlib>=0.1.2",
    # Platform backends: wheels exist for one OS only, so the marker is the gate.
    "SpoutGL>=0.1.1; sys_platform == 'win32'",
    "syphon-python>=0.2.0; sys_platform == 'darwin'",
    "haybale-core",
]
description = "Share video frames between applications over Syphon, Spout, NDI and OMT"
keywords = ["video", "streaming", "syphon", "spout", "ndi", "omt", "texture sharing"]

[[project.authors]]
name = "maybites"

[project.urls]
Homepage = "https://github.com/going-haywire/haybale-stream"
Documentation = "https://github.com/going-haywire/haybale-stream#readme"
Issues = "https://github.com/going-haywire/haybale-stream/issues"
Source = "https://github.com/going-haywire/haybale-stream"

[build-system]
requires = [ "hatchling",]
build-backend = "hatchling.build"

[project.license]
text = "MIT"

[project.entry-points."haywire.libraries"]
stream = "haybale_stream:Library"

[tool.hatch.build.targets.wheel]
packages = [ "haybale_stream",]

[tool.hatch.build.targets.sdist]
include = [ "haybale_stream/", "README.md",]
