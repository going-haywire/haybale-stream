name: Publish

# Publishes every barn/* library to PyPI on a version tag, when the root
# pyproject.toml declares  [tool.haywire.marketstall] distribute = "pypi".
# With any other value the run ends green without publishing.
# To retry a failed run: gh workflow run publish.yml --ref vX.Y.Z

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.12'

jobs:
  guard:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.plan.outputs.enabled }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Decide what to publish
        id: plan
        run: python3 .github/publish_plan.py

  build:
    name: Build ${{ matrix.lib.dist }}
    needs: guard
    if: needs.guard.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lib: ${{ fromJSON(needs.guard.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      # The repo root is a dev-only uv workspace whose [tool.uv.sources] point at a sibling monorepo
      # that does not exist in CI, so nothing here syncs or builds from the root: each step works from
      # the library's own directory.
      - name: Build wheel and sdist
        working-directory: ${{ matrix.lib.path }}
        run: |
          rm -rf "${GITHUB_WORKSPACE}/dist"
          uv build --out-dir "${GITHUB_WORKSPACE}/dist"
      # Resolving the built wheel against real PyPI is the one thing a local editable checkout can
      # never verify. A failure here is a dependency-range bug in the library's pyproject.toml.
      - name: Smoke-test the wheel
        run: |
          uv venv --python ${{ env.PYTHON_VERSION }} /tmp/smoke
          export VIRTUAL_ENV=/tmp/smoke
          if ! uv pip install --dry-run dist/*.whl; then
            echo "::error::Dependencies of ${{ matrix.lib.dist }} do not resolve on linux/py${{ env.PYTHON_VERSION }} from PyPI. Fix the ranges in ${{ matrix.lib.path }}/pyproject.toml before releasing."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.lib.dist }}
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish ${{ matrix.lib.dist }}
    needs: [guard, build]
    if: needs.guard.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lib: ${{ fromJSON(needs.guard.outputs.matrix) }}
    environment:
      name: pypi
      url: https://pypi.org/project/${{ matrix.lib.dist }}/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-${{ matrix.lib.dist }}
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
