# The same checks every night, on Linux and macOS, against core's master as it is then:
# a red run means a core change broke this library. Core's release view reads the latest
# result (`release_sweep.py nightly`).
name: nightly

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: going-haywire/.github/.github/workflows/library-ci.yml@df1b6ec41026e7706408486d4ac628ec8236a528 # 2026-11-18, going-haywire/.github#2
    with:
      # NDI/OMT discovery needs a local network with mDNS, which a runner lacks. No spaces:
      # the reusable workflow splits these arguments on whitespace.
      pytest-args: -q --maxfail=0 -m not(network)
